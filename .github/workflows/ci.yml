name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Tests (PySpark + Delta, app, end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: pytest
        run: uv run pytest -v
      - name: Starter kit still imports and every test collects against it
        run: uv run pytest --impl starter --collect-only -q

  iac:
    name: Infrastructure as code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt / validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - uses: databricks/setup-cli@main
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Asset Bundle against the CLI's JSON schema (no workspace needed)
        run: |
          databricks bundle schema > "$RUNNER_TEMP/bundle_schema.json"
          uv run --frozen python scripts/validate_bundle.py "$RUNNER_TEMP/bundle_schema.json"
      - name: Wheel builds
        run: uv build --wheel
