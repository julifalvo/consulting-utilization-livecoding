# Daily job: bronze -> silver -> gold -> quality, each a task on serverless compute.
# Separate tasks = separate retries and a clear failure point in the run graph.
resources:
  jobs:
    utilization_daily:
      name: consultant-utilization-daily
      max_concurrent_runs: 1  # MERGE is idempotent, but two concurrent runs would still race
      schedule:
        quartz_cron_expression: "0 0 7 ? * MON-FRI"
        timezone_id: UTC
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tags:
        domain: staffing
        data_owner: finance-analytics

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: bronze
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: utilization
            entry_point: utilization
            parameters:
              - run
              - --stage=bronze
              - --catalog=${var.catalog}
              - --landing=/Volumes/${var.catalog}/raw/timesheets_landing

        - task_key: silver
          depends_on: [{ task_key: bronze }]
          environment_key: default
          max_retries: 1
          python_wheel_task:
            package_name: utilization
            entry_point: utilization
            parameters:
              - run
              - --stage=silver
              - --catalog=${var.catalog}

        - task_key: gold
          depends_on: [{ task_key: silver }]
          environment_key: default
          python_wheel_task:
            package_name: utilization
            entry_point: utilization
            parameters:
              - run
              - --stage=gold
              - --catalog=${var.catalog}

        - task_key: quality
          depends_on: [{ task_key: gold }]
          environment_key: default
          python_wheel_task:
            package_name: utilization
            entry_point: utilization
            parameters:
              - run
              - --stage=quality
              - --catalog=${var.catalog}
