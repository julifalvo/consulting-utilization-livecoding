[project]
name = "utilization"
version = "0.1.0"
description = "Live-coding kit: firm-wide consultant utilization dataset on Databricks-style PySpark + Delta, with a FastAPI app, Asset Bundles, Terraform and CI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pyspark>=4.0,<4.3",
    "delta-spark>=4.0,<4.5",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "deltalake>=1.0",
    "duckdb>=1.1",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "anthropic>=2.0",
]

[project.scripts]
utilization = "utilization.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyyaml>=6",
    "regex>=2024.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utilization"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "starter", "tests", "app", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["utilization", "starter", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "app"]
addopts = "-q"
markers = [
    "spark: starts a local SparkSession (needs Java 17+; on Windows run inside the dev container)",
    "solution_only: exercises the I/O layer, not part of the live-coding exercise",
]
